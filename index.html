<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProSpaces CRM</title>
    <meta name="description" content="Comprehensive ProSpaces CRM application featuring inventory management, shopping list planning, and backend-driven competitor pricing intelligence." />
    <meta property="og:title" content="ProSpaces CRM" />
    <meta property="og:description" content="Comprehensive ProSpaces CRM application featuring inventory management, shopping list planning, and backend-driven competitor pricing intelligence." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/jpeg" href="/logistics-favicon.jpg" />
    <link rel="shortcut icon" href="/logistics-favicon.jpg" />
    <link rel="apple-touch-icon" href="/logistics-logo.png" />
    <script>
      // Bulletproof active Service Worker & Cache Storage healer with sessionStorage guard to prevent infinite reloads
      (function() {
        var unregisterAndPurge = function() {
          var purgeFlag = 'sw_purge_done_v3';
          if (sessionStorage.getItem(purgeFlag)) {
            console.log('[SW-Purge] Service workers found, but purge already completed in this session. Skipping to avoid infinite reload loop.');
            return;
          }
          sessionStorage.setItem(purgeFlag, 'true');

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              if (registrations && registrations.length > 0) {
                var promises = registrations.map(function(reg) {
                  console.log('[SW-Purge] Unregistering service worker scope:', reg.scope);
                  return reg.unregister();
                });
                Promise.all(promises).then(function() {
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                        console.log('[SW-Purge] All caches deleted. Reloading page...');
                        window.location.reload();
                      });
                    }).catch(function() {
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                });
              }
            });
          }
        };

        if ('serviceWorker' in navigator) {
          if (navigator.serviceWorker.controller) {
            console.log('[SW-Purge] Active controller found.');
            unregisterAndPurge();
          } else {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                console.log('[SW-Purge] registrations found:', regs.length);
                unregisterAndPurge();
              }
            });
          }
        }

        try {
          sessionStorage.removeItem("sw_clean_reload_attempted");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        function sendError(msg, extra) {
          try {
            var text = String(msg || '');
            if (
              !text ||
              text === 'Script error.' ||
              text.includes('ResizeObserver') ||
              text.includes('websocket') ||
              text.includes('WebSocket') ||
              text.includes('Loading chunk') ||
              text.includes('dynamically imported module') ||
              text.includes('AbortError') ||
              text.includes('aborted') ||
              text.includes('Failed to fetch') ||
              text.includes('NetworkError') ||
              text.includes('extension') ||
              text.includes('chrome-extension')
            ) {
              return;
            }
            fetch("/api/log-error", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: text, extra: extra || null, url: window.location.href, timestamp: new Date().toISOString() })
            }).catch(function() {});
          } catch(err) {}
        }
        window.addEventListener("error", function(e) {
          if (e && e.message) {
            sendError(e.message, { filename: e.filename, lineno: e.lineno, colno: e.colno });
          }
        });
        window.addEventListener("unhandledrejection", function(e) {
          if (e && e.reason) {
            sendError(e.reason.message || String(e.reason));
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
