<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProSpaces — Insights Space</title>
    <script>
      // Bulletproof active Service Worker & Cache Storage healer with auto-reload bypass
      (function() {
        var unregisterAndReload = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              if (registrations && registrations.length > 0) {
                var promises = registrations.map(function(reg) {
                  return reg.unregister();
                });
                Promise.all(promises).then(function() {
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                        window.location.reload();
                      });
                    }).catch(function() {
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                });
              }
            });
          }
        };

        if ('serviceWorker' in navigator) {
          if (navigator.serviceWorker.controller) {
            unregisterAndReload();
          } else {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                unregisterAndReload();
              }
            });
          }
        }

        try {
          sessionStorage.removeItem("sw_clean_reload_attempted");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/insights-entry.tsx"></script>
  </body>
</html>
